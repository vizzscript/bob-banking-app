{% extends "base.html" %}
{% block title %}Dashboard — SecureBank{% endblock %}

{% block content %}
<div class="mb-4">
  <h3 class="fw-semibold">
    <i class="bi bi-person-check-fill text-primary me-2"></i>
    Welcome back, {{ customer_name }}
  </h3>
  <p class="text-muted mb-0">Here is a summary of your account.</p>
</div>

<div class="row g-4 mb-4">
  <div class="col-sm-6 col-lg-4">
    <div class="card border-0 shadow-sm h-100">
      <div class="card-body text-center py-4">
        <div class="mb-2">
          <i class="bi bi-wallet2 display-5 text-success"></i>
        </div>
        <p class="text-muted mb-1 small text-uppercase fw-semibold">
          Current Balance
        </p>
        <h2 class="fw-bold text-success mb-0">&#163;{{ balance }}</h2>
      </div>
    </div>
  </div>
</div>

<div class="d-flex flex-wrap gap-3">
  <a href="{{ url_for('deposit') }}" class="btn btn-success btn-lg">
    <i class="bi bi-arrow-down-circle-fill me-2"></i>Deposit Funds
  </a>
  <a href="{{ url_for('withdraw') }}" class="btn btn-warning btn-lg">
    <i class="bi bi-arrow-up-circle-fill me-2"></i>Withdraw Funds
  </a>
</div>
{% endblock %}
