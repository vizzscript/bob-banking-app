<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SecureBank{% endblock %}</title>

  <!-- Bootstrap 5 CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <!-- Custom styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="bg-light">

  <!-- Navigation bar -->
  <nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        <i class="bi bi-bank me-2"></i>SecureBank
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-md-0 align-items-md-center gap-md-1">

          {% if session.get('customer_id') %}
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
                 href="{{ url_for('dashboard') }}">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'deposit' %}active{% endif %}"
                 href="{{ url_for('deposit') }}">
                <i class="bi bi-arrow-down-circle me-1"></i>Deposit
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'withdraw' %}active{% endif %}"
                 href="{{ url_for('withdraw') }}">
                <i class="bi bi-arrow-up-circle me-1"></i>Withdraw
              </a>
            </li>
            <li class="nav-item ms-md-2">
              <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </a>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'login' %}active{% endif %}"
                 href="{{ url_for('login') }}">
                <i class="bi bi-person-circle me-1"></i>Login
              </a>
            </li>
          {% endif %}

        </ul>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
