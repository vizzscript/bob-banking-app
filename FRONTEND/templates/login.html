{% extends "base.html" %}
{% block title %}Login — SecureBank{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5">

    <div class="text-center mb-4">
      <i class="bi bi-bank2 display-4 text-primary"></i>
      <h2 class="mt-2 fw-semibold">Welcome to SecureBank</h2>
      <p class="text-muted">Sign in to your account</p>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4">

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                required
                autofocus
                autocomplete="username"
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </div>

        </form>
      </div>
    </div>

    <p class="text-center text-muted mt-3" style="font-size: 0.85rem;">
      Demo credentials: <strong>john_doe</strong> / <strong>password123</strong>
    </p>

  </div>
</div>
{% endblock %}
