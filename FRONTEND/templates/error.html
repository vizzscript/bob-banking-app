{% extends "base.html" %}
{% block title %}{{ code }} Error — SecureBank{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4 text-center">
    <i class="bi bi-exclamation-circle display-1 text-danger mb-3"></i>
    <h2 class="fw-bold">Error {{ code }}</h2>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i>Go to Home
    </a>
  </div>
</div>
{% endblock %}
